apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "spring-app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # Keep the last five ReplicaSets so "helm rollback" and
  # "kubectl rollout undo" have something to go back to.
  revisionHistoryLimit: 5
  minReadySeconds: {{ .Values.minReadySeconds }}
  selector:
    matchLabels:
      {{- include "spring-app.selectorLabels" . | nindent 6 }}
  strategy:
    # Start one new pod, wait until it is ready, then stop one old pod.
    # The number of ready pods therefore never drops below replicaCount.
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        {{- include "spring-app.labels" . | nindent 8 }}
        # "app" and "version" are the labels Istio shows in its telemetry.
        app: {{ .Release.Name }}
        version: {{ .Values.image.tag | quote }}
      {{- if or .Values.meshRevision .Values.podAnnotations }}
      annotations:
        {{- with .Values.meshRevision }}
        # Changing this value restarts the pods (used after Istio upgrades).
        demo.example.com/mesh-revision: {{ . | quote }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      serviceAccountName: {{ .Release.Name }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        # Same non-root user as in the Dockerfile.
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # Prefer to put the pods into different zones and on different nodes.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "spring-app.selectorLabels" . | nindent 14 }}
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "spring-app.selectorLabels" . | nindent 14 }}
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            # Name shown in the page header.
            - name: APP_NAME
              value: {{ .Values.displayName | quote }}
            # Pod name, shown on the page so you can see which replica answered.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # OIDC client id = release name (app1 or app2).
            - name: OIDC_CLIENT_ID
              value: {{ .Release.Name | quote }}
            # OIDC client secret, generated by the scripts or by Terraform.
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "spring-app.secretName" . }}
                  key: client-secret
            # Issuer as the browser sees it. Must match the "iss" claim in tokens.
            - name: OIDC_PUBLIC_ISSUER
              value: {{ printf "https://keycloak.%s/realms/%s" .Values.baseDomain .Values.oidc.realm | quote }}
            # Same realm, reached inside the cluster (pod to pod, through the mesh).
            - name: OIDC_INTERNAL_ISSUER
              value: {{ printf "%s/realms/%s" .Values.oidc.internalBaseUrl .Values.oidc.realm | quote }}
            # Link to the other application.
            - name: OTHER_APP_NAME
              value: {{ .Values.otherApp.name | quote }}
            - name: OTHER_APP_URL
              value: {{ printf "https://%s.%s" .Values.otherApp.host .Values.baseDomain | quote }}
            # Folder on the shared NFS volume.
            - name: SHARED_DIR
              value: {{ .Values.sharedVolume.mountPath | quote }}
            # URLs for the egress test buttons.
            - name: EGRESS_ALLOWED_URL
              value: {{ printf "https://%s%s" .Values.egress.allowedHost .Values.egress.allowedPath | quote }}
            - name: EGRESS_BLOCKED_URL
              value: {{ printf "https://%s/" .Values.egress.blockedHost | quote }}
            # Let the JVM use 60% of the memory limit for its heap.
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=60 -Djava.io.tmpdir=/tmp"
          # Startup probe: give the JVM up to two minutes to start.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 3
            failureThreshold: 40
          # Readiness probe: only send traffic to pods that are ready.
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 3
          # Liveness probe: restart a pod that hangs.
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 6
          lifecycle:
            # Wait before stopping, so the mesh stops sending new requests to
            # this pod first. Then Spring Boot finishes the running requests.
            preStop:
              sleep:
                seconds: {{ .Values.preStopSleepSeconds }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # Shared notes (NFS, ReadWriteMany).
            - name: shared
              mountPath: {{ .Values.sharedVolume.mountPath }}
            # Writable temp folder, needed because the root filesystem is read-only.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: shared
          persistentVolumeClaim:
            claimName: {{ .Values.sharedVolume.existingClaim }}
        - name: tmp
          emptyDir: {}
