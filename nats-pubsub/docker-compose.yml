# NATS server (the pub/sub broker). Start with:  docker compose up -d
services:
  nats:
    image: nats:2-alpine
    container_name: nats-pubsub-server
    command: ["-c", "/etc/nats/nats-server.conf"]
    volumes:
      - ./server/nats-server.conf:/etc/nats/nats-server.conf:ro
    ports:
      - "4222:4222"   # client connections
      - "8222:8222"   # HTTP monitoring  (http://localhost:8222/varz)
    restart: unless-stopped
