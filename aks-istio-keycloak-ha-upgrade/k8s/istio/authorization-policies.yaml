# Who may call whom. As soon as a workload has an ALLOW policy, everything that
# is not listed is denied. The identities come from the mTLS certificates.

# PostgreSQL: only Keycloak and PostgreSQL itself (the new version reads from
# the old one during the upgrade) may connect, and only to port 5432.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: postgres-allow-clients
  namespace: postgres
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/keycloak/sa/keycloak
              - cluster.local/ns/postgres/sa/postgres
      to:
        - operation:
            ports: ["5432"]
---
# Keycloak: the ingress gateway (browsers) and the pods in namespace "apps"
# (token and key requests) may call port 8080.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: keycloak-allow-clients
  namespace: keycloak
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/istio-ingress/sa/istio-ingressgateway
      to:
        - operation:
            ports: ["8080"]
    - from:
        - source:
            namespaces: ["apps"]
      to:
        - operation:
            ports: ["8080"]
---
# Applications: only the ingress gateway may call them.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: apps-allow-ingress
  namespace: apps
spec:
  # No selector = every workload in the namespace.
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/istio-ingress/sa/istio-ingressgateway
      to:
        - operation:
            ports: ["8080"]
