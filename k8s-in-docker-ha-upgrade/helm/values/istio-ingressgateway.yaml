# Values for the Istio "gateway" chart, release "istio-ingressgateway".
# The scripts add "--set revision=<tag>".

# A fixed number of pods instead of autoscaling. Two pods, so one can be
# drained during node upgrades.
replicaCount: 2
autoscaling:
  enabled: false

resources:
  requests:
    # Guaranteed CPU share.
    cpu: 50m
    # Guaranteed memory.
    memory: 96Mi
  limits:
    # CPU ceiling.
    cpu: 1000m
    # Hard memory ceiling.
    memory: 512Mi

podDisruptionBudget:
  # At least one gateway pod must stay up during node drains.
  minAvailable: 1
  # A pod that is not healthy anyway may always be evicted.
  unhealthyPodEvictionPolicy: AlwaysAllow

# Prefer to put the gateway pods into different zones and on different nodes.
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        istio: ingressgateway
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        istio: ingressgateway

service:
  # NodePort: every worker node accepts the traffic on a fixed port and passes
  # it to a gateway pod, wherever that pod runs. The "edge" container
  # (docker/edge/haproxy.cfg) balances over these node ports - the same job a
  # cloud load balancer does in front of a real cluster.
  type: NodePort
  ports:
    # Health port of the gateway pods.
    - name: status-port
      port: 15021
      protocol: TCP
      targetPort: 15021
    # https: port 443 of the gateway, reachable on port 30443 of every node.
    - name: https
      port: 443
      protocol: TCP
      targetPort: 443
      nodePort: 30443

# Seconds a gateway pod gets to finish open connections before it is killed.
terminationGracePeriodSeconds: 60
