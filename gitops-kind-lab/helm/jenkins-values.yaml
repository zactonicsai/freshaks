# Lab values for jenkins/jenkins
# UI NodePort 30090 → host 8082

controller:
  admin:
    username: admin
  serviceType: NodePort
  servicePort: 8080
  nodePort: 30090
  installPlugins:
    - kubernetes:latest
    - workflow-aggregator:latest
    - git:latest
    - configuration-as-code:latest
    - credentials-binding:latest
    - plain-credentials:latest
    - job-dsl:latest
    - gitea:latest
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 2Gi
  javaOpts: "-Xms512m -Xmx1536m"

persistence:
  enabled: true
  size: 8Gi

agent:
  enabled: true
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
  podTemplates:
    kaniko: |
      - name: kaniko
        label: kaniko
        serviceAccount: jenkins
        containers:
          - name: kaniko
            image: gcr.io/kaniko-project/executor:debug
            command: ["/busybox/cat"]
            tty: true
          - name: git
            image: alpine/git:latest
            command: ["cat"]
            tty: true
