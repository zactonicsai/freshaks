# Headless Service: gives the pod a stable DNS name
# (<release>.<namespace>.svc.cluster.local) that always means "this version".
# The stable name "postgres" that Keycloak uses is a separate Service
# (k8s/postgres/service-active.yaml) that points at the active release.
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "postgres.labels" . | nindent 4 }}
spec:
  # "None" = no virtual IP, DNS returns the pod IP directly.
  clusterIP: None
  selector:
    {{- include "postgres.selectorLabels" . | nindent 4 }}
  ports:
    # The "tcp-" prefix tells Istio to treat this port as plain TCP.
    - name: tcp-postgres
      port: 5432
      targetPort: tcp-postgres
