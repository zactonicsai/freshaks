apiVersion: v1
kind: Service
metadata:
  name: {{ include "identity.keycloakName" . }}
  labels:
    {{- include "identity.labels" . | nindent 4 }}
spec:
  type: ClusterIP # Not a NodePort/LoadBalancer: ingress goes through Istio.
  selector:
    {{- include "identity.keycloakSelector" . | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  # Port 9000 is purposefully NOT exposed as a Service port.
