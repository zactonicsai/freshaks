# One identity for every PostgreSQL release (old and new version). Istio turns
# it into the mTLS identity cluster.local/ns/postgres/sa/postgres, which the
# AuthorizationPolicy uses to let the new version read from the old one.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres
  namespace: postgres
# PostgreSQL never talks to the Kubernetes API, so it gets no API token.
automountServiceAccountToken: false
