# The realm definition (clients, roles, test users) as a Secret, because it
# contains client secrets and passwords. Keycloak imports it only when the
# realm does not exist yet; later changes must be made through Keycloak itself.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-realm
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}
type: Opaque
stringData:
  demo-realm.json: |
    {{- tpl (.Files.Get "files/demo-realm.json") . | nindent 4 }}
