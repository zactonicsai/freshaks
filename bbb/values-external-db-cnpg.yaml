# examples/values-external-db-cnpg.yaml
#
# Overlay: point Keycloak at the CloudNativePG cluster from examples/cnpg-cluster.yaml
# and switch the bundled Postgres off. Layer it on top of a base file:
#
#   helm upgrade --install keycloak ./chart -n keycloak \
#     -f examples/values-cloud-tls-gateway.yaml \
#     -f examples/values-external-db-cnpg.yaml
#
# (Maps merge key by key, so only the keys below change.)

upstream:
  database:
    vendor: postgres
    hostname: keycloak-pg-rw.keycloak.svc.cluster.local   # CNPG read-write service (follows the primary on failover)
    # hostname: keycloak-pg-pooler-rw.keycloak.svc.cluster.local   # if using the session-mode Pooler
    port: 5432
    database: keycloak
    username: keycloak
    password: ""                                          # must be empty when using existingSecret
    existingSecret: keycloak-db-app                       # created for cnpg bootstrap (basic-auth)
    existingSecretKey: password

  dbchecker:
    enabled: true

  extraEnv: |-
    - name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC
      value: "true"
    - name: KC_LOG_LEVEL
      value: "INFO"
    - name: KC_DB_POOL_MIN_SIZE
      value: "5"
    - name: KC_DB_POOL_MAX_SIZE
      value: "30"
    - name: KC_DB_URL_PROPERTIES                          # TLS to the DB; CNPG issues server certs automatically
      value: "?sslmode=verify-full&sslrootcert=/opt/keycloak/conf/pg-ca/ca.crt"
    - name: KC_TRANSACTION_XA_ENABLED
      value: "false"

  extraVolumes: |-
    - name: pg-ca
      secret:
        secretName: keycloak-pg-ca                        # CNPG creates <cluster>-ca with ca.crt
  extraVolumeMounts: |-
    - name: pg-ca
      mountPath: /opt/keycloak/conf/pg-ca
      readOnly: true

bb-common:
  networkPolicies:
    egress:
      from:
        keycloak:
          to:
            k8s: ["keycloak/keycloak-pg-rw:5432", "keycloak/keycloak-pg-pooler-rw:5432"]

postgresql:
  enabled: false
