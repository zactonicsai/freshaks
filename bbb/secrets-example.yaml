# examples/secrets-example.yaml
#
# Every out-of-band Secret the cloud examples reference, with the kubectl command that creates it.
# Do NOT commit real values; in git use SOPS (Big Bang) / External Secrets / Sealed Secrets.
#
# ---------------------------------------------------------------------------
# 1. Iron Bank pull secret (namespace: keycloak)
# kubectl -n keycloak create secret docker-registry private-registry \
#   --docker-server=registry1.dso.mil --docker-username="$REGISTRY1_USERNAME" --docker-password="$REGISTRY1_PASSWORD"
#
# 2. Bootstrap admin (referenced via upstream.extraEnvFrom secretRef; Keycloak 26 names)
# kubectl -n keycloak create secret generic keycloak-admin \
#   --from-literal=KC_BOOTSTRAP_ADMIN_USERNAME=admin \
#   --from-literal=KC_BOOTSTRAP_ADMIN_PASSWORD="$(openssl rand -base64 24)"
#
# 3. External DB password (upstream.database.existingSecret / existingSecretKey)
# kubectl -n keycloak create secret generic keycloak-db --from-literal=password='...'
#    CNPG variant (basic-auth, used by both the operator's bootstrap and Keycloak):
# kubectl -n keycloak create secret generic keycloak-db-app --type=kubernetes.io/basic-auth \
#   --from-literal=username=keycloak --from-literal=password='...'
#
# 4. Bundled Bitnami Postgres with an existing secret (postgresql.global.postgresql.auth.existingSecret)
# kubectl -n keycloak create secret generic keycloak-postgresql-auth \
#   --from-literal=password='...' --from-literal=postgres-password='...'
#
# 5. Gateway TLS (TLS terminated at Istio) — must live in the GATEWAY namespace
#    cert-manager:
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: keycloak-example-com
  namespace: istio-gateway
spec:
  secretName: keycloak-example-com-tls        # -> Gateway.spec.servers[].tls.credentialName
  dnsNames: ["keycloak.example.com"]
  issuerRef: {name: letsencrypt-prod, kind: ClusterIssuer}
---
#    or manual:
# kubectl -n istio-gateway create secret tls keycloak-example-com-tls --cert=fullchain.pem --key=privkey.pem
#
# 6. Pod TLS (passthrough variant) — in the KEYCLOAK namespace, mounted at /opt/keycloak/conf/tls
# kubectl -n keycloak create secret tls keycloak-tls --cert=fullchain.pem --key=privkey.pem
#    (cert-manager: same Certificate as above but namespace: keycloak, secretName: keycloak-tls)
#
# 7. Truststore for client-cert (CAC) validation — PKCS12 with the CA chain, no password
# keytool -importcert -noprompt -trustcacerts -storetype PKCS12 -keystore truststore.pfx -storepass changeit -alias dod-root -file DoDRoot6.cer
# kubectl -n keycloak create secret generic keycloak-truststore --from-file=truststore.pfx
#    (then KC_TRUSTSTORE_PATHS=/opt/keycloak/conf/truststore/truststore.pfx ; add KC_TRUSTSTORE_PASSWORD if you set one)
#
# 8. Realm import (--import-realm reads /opt/keycloak/data/import/*.json)
# kubectl -n keycloak create secret generic keycloak-realm --from-file=realm.json=./my-realm.json
#    Large realms (>1 MiB) exceed the Secret limit: use a ConfigMap per realm or an init container that pulls from object storage.
#
# ---------------------------------------------------------------------------
# What the chart creates itself (do not create these by hand):
#   keycloak-keycloak-env        from upstream.secrets.env.stringData
#   keycloak-keycloak-<name>     from every other upstream.secrets.<name>
#   keycloak-keycloak-db         from upstream.database.password (only when existingSecret is empty)
#   keycloak-postgresql          Bitnami chart's generated password (only when auth.existingSecret is empty)
#
# Rotation notes:
#   - Changing anything under upstream.secrets rolls the pods (checksum annotation).
#   - Changing an out-of-band secret does NOT roll the pods: `kubectl -n keycloak rollout restart sts/keycloak-keycloak`.
#   - DB password rotation: change it in Postgres first (ALTER USER ...), then the Secret, then restart.
