###################################################
# docker/nfs/vfs.conf — start configuration of the NFS server (NFS-Ganesha)
# that runs in the pod "nfs-server-provisioner-0".
#
# The install script copies this file onto the NFS server's disk BEFORE the
# pod starts for the first time. The provisioner keeps an existing file and
# appends one EXPORT block per volume it creates.
#
# It is the provisioner's built-in default with ONE addition:
#   Only_Numeric_Owners = true;
# NFS version 4 normally sends file owners as NAMES ("postgres@domain"), and a
# client that cannot translate the name shows the owner as "nobody".
# PostgreSQL refuses to start when its data folder seems to belong to someone
# else. With this setting the server sends plain numbers (999), which every
# client understands.
###################################################

EXPORT {

	# Export Id (mandatory, each EXPORT must have a unique Export_Id)
	Export_Id = 0;
	# Exported path (mandatory)
	Path = /;
	# Pseudo Path (required for NFS v4)
	Pseudo = /;
	Protocols = 4;
	Access_Type = MDONLY_RO;
	Filesystem_Id = 152.152;

	FSAL {

		Name = PSEUDO;

	}
}

NFS_Core_Param
{
	MNT_Port = 20048;
	NLM_Port = 32803;
	fsid_device = true;
	allow_set_io_flusher_fail = true;
}

NFSV4
{
	Grace_Period = 90;
	Only_Numeric_Owners = true;
}
