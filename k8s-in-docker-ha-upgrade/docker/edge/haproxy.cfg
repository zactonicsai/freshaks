# =============================================================================
# docker/edge/haproxy.cfg — the load balancer in front of the worker nodes.
# It plays the role a cloud load balancer plays for a real cluster:
#   your browser -> edge:HTTPS_PORT -> port 30443 on a healthy worker node
#                -> Istio ingress gateway pod (which ends TLS)
# "${...}" values come from the environment (see docker-compose.yml).
# =============================================================================

global
    # Write log lines to the container output ("docker logs k8s-ha-demo-edge").
    log stdout format raw local0 notice
    # Admin interface, reachable only inside the Docker network. The upgrade
    # script uses it to take a node out of rotation before the node is stopped.
    stats socket ipv4@*:9999 level admin

defaults
    # Pass TCP connections through unchanged; HAProxy never sees inside TLS.
    mode tcp
    log global
    # Give up connecting to a node after 3 seconds ...
    timeout connect 3s
    # ... and try another node instead (up to 3 attempts).
    retries 3
    option redispatch
    # Idle connections (browser keep-alive) may stay open this long.
    timeout client 10m
    timeout server 10m

frontend https_in
    # Listen on the published port.
    bind "*:${HTTPS_PORT}"
    default_backend ingress_nodes

backend ingress_nodes
    # Spread new connections evenly.
    balance roundrobin
    # Health check: try to connect every 2 seconds; 2 failures = node is out,
    # 2 successes = node is back. When a node goes down, close its connections
    # at once so clients reconnect through another node.
    default-server check inter 2s fall 2 rise 2 on-marked-down shutdown-sessions
    # NodePort 30443 of the Istio ingress gateway Service on every worker node.
    server agent-1 "${SUBNET_PREFIX}.11:30443"
    server agent-2 "${SUBNET_PREFIX}.12:30443"
    server agent-3 "${SUBNET_PREFIX}.13:30443"
