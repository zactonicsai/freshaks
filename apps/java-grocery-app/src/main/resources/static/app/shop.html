<!doctype html>
<html lang="en">
<head>
<title>Fresh Mart — shop</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: { colors: { brand: "#1F7A4D", "brand-dark": "#165C3A", cream: "#FBF8F1", accent: "#E07A2F" } } } };
</script>
<link rel="stylesheet" href="/css/site.css">
<script src="/js/app.js"></script>
</head>
<body class="bg-cream text-stone-800 min-h-screen">
<nav id="nav" class="bg-white border-b border-stone-200"></nav>

<main class="max-w-5xl mx-auto px-4 py-8">
  <h1 class="text-3xl font-bold text-stone-900">🛒 The shelves</h1>
  <p class="text-stone-600 mt-1">Pick what you need, then place your order. A cashier will ring it up at the register.</p>

  <div class="grid lg:grid-cols-3 gap-6 mt-6">
    <section class="lg:col-span-2">
      <div id="products" class="grid sm:grid-cols-2 gap-4">Loading products…</div>
    </section>

    <aside class="card p-5 h-fit lg:sticky lg:top-4">
      <h2 class="font-semibold text-stone-900">Your basket</h2>
      <div id="cart" class="mt-3 text-sm space-y-2 text-stone-600">Empty — add something from the shelves.</div>
      <div class="flex justify-between font-semibold mt-4 pt-3 border-t border-stone-200"><span>Total</span><span id="cart-total">$0.00</span></div>
      <button id="place-order" class="mt-4 w-full px-4 py-2.5 rounded-xl bg-brand text-white font-semibold hover:bg-brand-dark disabled:opacity-40" disabled>Place order</button>
      <p id="order-message" class="mt-3 text-sm text-brand font-medium"></p>
    </aside>
  </div>

  <section class="mt-10">
    <h2 class="text-xl font-semibold text-stone-900">🧾 My receipts</h2>
    <div id="receipts" class="mt-3 grid md:grid-cols-2 gap-4 text-sm">Loading…</div>
  </section>
</main>
<div id="toast" class="hidden"></div>

<script>
  var cart = {};   // productId -> {product, quantity}

  function renderProducts(products) {
    FM.el('products').innerHTML = products.map(function (p) {
      var out = p.stock <= 0;
      return '<div class="card p-4 flex items-center gap-4" data-testid="product-card">' +
        '<div class="text-4xl">' + FM.esc(p.emoji) + '</div>' +
        '<div class="flex-1"><div class="font-semibold text-stone-900">' + FM.esc(p.name) + '</div>' +
        '<div class="text-sm text-stone-500">' + FM.money(p.price) + ' · ' + p.stock + ' left</div></div>' +
        '<button class="add-btn px-3 py-1.5 rounded-lg bg-brand text-white text-sm font-medium hover:bg-brand-dark disabled:opacity-40" ' +
        'data-id="' + p.id + '" ' + (out ? 'disabled' : '') + '>' + (out ? 'Sold out' : 'Add') + '</button></div>';
    }).join('');
    var btns = document.querySelectorAll('.add-btn');
    for (var i = 0; i < btns.length; i++) {
      btns[i].addEventListener('click', function (ev) {
        var id = ev.currentTarget.getAttribute('data-id');
        var product = products.filter(function (p) { return String(p.id) === id; })[0];
        if (!cart[id]) { cart[id] = { product: product, quantity: 0 }; }
        if (cart[id].quantity < product.stock) { cart[id].quantity += 1; }
        renderCart();
      });
    }
  }

  function renderCart() {
    var ids = Object.keys(cart).filter(function (id) { return cart[id].quantity > 0; });
    var total = 0;
    if (!ids.length) {
      FM.el('cart').innerHTML = 'Empty — add something from the shelves.';
    } else {
      FM.el('cart').innerHTML = ids.map(function (id) {
        var line = cart[id];
        total += line.quantity * line.product.price;
        return '<div class="flex items-center justify-between gap-2">' +
          '<span>' + FM.esc(line.product.emoji) + ' ' + FM.esc(line.product.name) + '</span>' +
          '<span class="flex items-center gap-1">' +
          '<button class="qty px-2 rounded bg-stone-100" data-id="' + id + '" data-d="-1">−</button>' +
          '<span class="w-6 text-center">' + line.quantity + '</span>' +
          '<button class="qty px-2 rounded bg-stone-100" data-id="' + id + '" data-d="1">+</button>' +
          '<span class="w-16 text-right">' + FM.money(line.quantity * line.product.price) + '</span></span></div>';
      }).join('');
      var q = document.querySelectorAll('.qty');
      for (var i = 0; i < q.length; i++) {
        q[i].addEventListener('click', function (ev) {
          var id = ev.currentTarget.getAttribute('data-id');
          cart[id].quantity = Math.max(0, cart[id].quantity + Number(ev.currentTarget.getAttribute('data-d')));
          renderCart();
        });
      }
    }
    FM.el('cart-total').textContent = FM.money(total);
    FM.el('place-order').disabled = !ids.length;
  }

  function renderReceipts(orders) {
    if (!orders.length) { FM.el('receipts').innerHTML = '<p class="text-stone-500">No receipts yet.</p>'; return; }
    FM.el('receipts').innerHTML = orders.map(function (o) {
      return '<div class="card p-4 receipt" data-testid="receipt">' +
        '<div class="flex justify-between"><span>Order #' + o.id + '</span>' +
        '<span class="' + (o.status === 'PAID' ? 'text-brand' : 'text-accent') + ' font-semibold">' + FM.esc(o.status) + '</span></div>' +
        '<div class="text-stone-500 text-xs">' + FM.when(o.createdAt) + '</div>' +
        '<div class="mt-2 space-y-0.5">' + o.items.map(function (it) {
          return '<div class="flex justify-between"><span>' + it.quantity + ' × ' + FM.esc(it.product.emoji) + ' ' + FM.esc(it.product.name) + '</span><span>' + FM.money(it.lineTotal) + '</span></div>';
        }).join('') + '</div>' +
        '<div class="flex justify-between font-semibold mt-2 pt-2 border-t border-dashed border-stone-300"><span>Total</span><span>' + FM.money(o.total) + '</span></div></div>';
    }).join('');
  }

  function load() {
    FM.api('/api/products').then(renderProducts).catch(function (e) { FM.toast(e.message, false); });
    FM.api('/api/orders/mine').then(renderReceipts).catch(function (e) { FM.toast(e.message, false); });
  }

  FM.el('place-order').addEventListener('click', function () {
    var items = Object.keys(cart).filter(function (id) { return cart[id].quantity > 0; })
      .map(function (id) { return { productId: Number(id), quantity: cart[id].quantity }; });
    FM.el('place-order').disabled = true;
    FM.api('/api/orders', { method: 'POST', body: { items: items } }).then(function (order) {
      cart = {};
      renderCart();
      FM.el('order-message').textContent = 'Order #' + order.id + ' placed — total ' + FM.money(order.total) + '. Take it to the register!';
      FM.toast('Order placed');
      load();
    }).catch(function (e) { FM.toast(e.message, false); FM.el('place-order').disabled = false; });
  });

  load();
</script>
<script src="/js/nav.js"></script>
</body>
</html>
