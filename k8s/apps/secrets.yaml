# Shared by both apps: how to reach the notebook (Postgres) and how to prove identity to the front office.
apiVersion: v1
kind: Secret
metadata:
  name: app-db-secret
  namespace: ${NS_APPS}
type: Opaque
stringData:
  DB_HOST: "${POSTGRES_HOST}"
  DB_NAME: "grocery"
  DB_USER: "grocery"
  DB_PASSWORD: "${APP_DB_PASSWORD}"
  DB_URL: "jdbc:postgresql://${POSTGRES_HOST}:5432/grocery"
  DATABASE_URL: "postgresql://grocery:${APP_DB_PASSWORD}@${POSTGRES_HOST}:5432/grocery"
---
apiVersion: v1
kind: Secret
metadata:
  name: oidc-secrets
  namespace: ${NS_APPS}
type: Opaque
stringData:
  JAVA_CLIENT_SECRET: "${JAVA_CLIENT_SECRET}"
  PYTHON_CLIENT_SECRET: "${PYTHON_CLIENT_SECRET}"
  FLASK_SECRET_KEY: "${PYTHON_CLIENT_SECRET}-session-${APP_DB_PASSWORD}"
