# Shared volume mounted by all four application pods (2 x app1, 2 x app2).
# A note saved through one pod is instantly visible through every other pod.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: shared-notes
  namespace: apps
spec:
  accessModes:
    # Many pods on many nodes may read and write.
    - ReadWriteMany
  # Served by the NFS server pod.
  storageClassName: nfs
  resources:
    requests:
      storage: __SHARED_NOTES_SIZE__
