# Identity of the application pods. Istio turns it into the mTLS identity
# cluster.local/ns/<namespace>/sa/<release>.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "spring-app.labels" . | nindent 4 }}
# The app never talks to the Kubernetes API, so it gets no API token.
automountServiceAccountToken: false
