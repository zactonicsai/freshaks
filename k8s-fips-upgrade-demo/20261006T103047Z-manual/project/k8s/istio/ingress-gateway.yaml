# The Istio ingress gateway, installed the way the Istio docs call "gateway injection":
# a tiny Deployment whose image is the word "auto". Istio fills in the real proxy at start-up,
# so restarting the pod is all it takes to pick up new mesh settings (like the FIPS policy).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: istio-ingressgateway
  namespace: __INGRESS_NS__
  labels: {app.kubernetes.io/part-of: fipsdemo}
---
apiVersion: v1
kind: Service
metadata:
  name: istio-ingressgateway
  namespace: __INGRESS_NS__
  labels: {app.kubernetes.io/part-of: fipsdemo}
spec:
  type: NodePort
  selector:
    istio: ingressgateway
  ports:
  - name: https
    port: 443
    targetPort: 443
    nodePort: __NODEPORT_HTTPS__
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: istio-ingressgateway
  namespace: __INGRESS_NS__
  labels: {app.kubernetes.io/part-of: fipsdemo}
spec:
  replicas: 1
  selector:
    matchLabels:
      istio: ingressgateway
  template:
    metadata:
      annotations:
        inject.istio.io/templates: gateway
      labels:
        istio: ingressgateway
        sidecar.istio.io/inject: "true"
    spec:
      serviceAccountName: istio-ingressgateway
      securityContext:
        sysctls:                       # lets a non-root proxy listen on port 443
        - name: net.ipv4.ip_unprivileged_port_start
          value: "0"
      containers:
      - name: istio-proxy
        image: auto
        securityContext:
          capabilities:
            drop: ["ALL"]
          runAsUser: 1337
          runAsGroup: 1337
---
# The gateway may read TLS certificates (Secrets) in its own namespace only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: istio-ingressgateway-sds
  namespace: __INGRESS_NS__
  labels: {app.kubernetes.io/part-of: fipsdemo}
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: istio-ingressgateway-sds
  namespace: __INGRESS_NS__
  labels: {app.kubernetes.io/part-of: fipsdemo}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: istio-ingressgateway-sds
subjects:
- kind: ServiceAccount
  name: istio-ingressgateway
  namespace: __INGRESS_NS__
