apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: ${NS_DATA}
  labels: {app: postgres}
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - {name: pg, containerPort: 5432}
          env:
            - {name: POSTGRES_USER, value: postgres}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: postgres-secret, key: POSTGRES_PASSWORD}}
            - name: KC_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: postgres-secret, key: KC_DB_PASSWORD}}
            - name: APP_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: postgres-secret, key: APP_DB_PASSWORD}}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: init, mountPath: /docker-entrypoint-initdb.d}
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "postgres"]}
            periodSeconds: 5
          livenessProbe:
            exec: {command: ["pg_isready", "-U", "postgres"]}
            periodSeconds: 20
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {memory: 1Gi}
      volumes:
        - name: init
          configMap: {name: postgres-init, defaultMode: 0755}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 8Gi}}
