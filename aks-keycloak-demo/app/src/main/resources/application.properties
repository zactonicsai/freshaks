server.port=8080

# The app sits behind the Istio gateway. The gateway tells the app
# "the visitor used https" with special headers. This line makes the app listen
# to those headers, so the links it builds start with https://.
server.forward-headers-strategy=native

# Login cookie safety: only send over https, hide from JavaScript.
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Only show the health check page. Nothing else.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# These values come from the Kubernetes Deployment (k8s/30-app.yaml).
# PUBLIC   = the address your browser uses to reach Keycloak.
# INTERNAL = the short-cut address the app uses inside the cluster.
demo.keycloak.public-url=${KEYCLOAK_PUBLIC_URL}
demo.keycloak.internal-url=${KEYCLOAK_INTERNAL_URL}
demo.keycloak.realm=${KEYCLOAK_REALM:demo}
demo.keycloak.client-id=${OIDC_CLIENT_ID:demo-app}
demo.keycloak.client-secret=${OIDC_CLIENT_SECRET}
# Only members of this Keycloak group may open /group
demo.required-group=${REQUIRED_GROUP:managers}
