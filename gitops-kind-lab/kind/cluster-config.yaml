kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: gitops
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry]
      config_path = "/etc/containerd/certs.d"
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
      - containerPort: 30080
        hostPort: 8081
        protocol: TCP
      - containerPort: 30090
        hostPort: 8082
        protocol: TCP
      - containerPort: 30790
        hostPort: 7990
        protocol: TCP
      - containerPort: 30799
        hostPort: 7999
        protocol: TCP
  - role: worker
