# Values for the Istio "gateway" chart, release "istio-egressgateway".
# All traffic that leaves the mesh for the internet passes through these pods.

# A fixed number of pods instead of autoscaling. Two pods, so one can be
# drained during node upgrades.
replicaCount: 2
autoscaling:
  enabled: false

resources:
  requests:
    # Guaranteed CPU share.
    cpu: 50m
    # Guaranteed memory.
    memory: 96Mi
  limits:
    # CPU ceiling.
    cpu: 1000m
    # Hard memory ceiling.
    memory: 512Mi

podDisruptionBudget:
  # At least one gateway pod must stay up during node drains.
  minAvailable: 1
  # A pod that is not healthy anyway may always be evicted.
  unhealthyPodEvictionPolicy: AlwaysAllow

# Prefer to put the gateway pods into different zones and on different nodes.
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        istio: egressgateway
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        istio: egressgateway

service:
  # Only reachable from inside the cluster.
  type: ClusterIP
