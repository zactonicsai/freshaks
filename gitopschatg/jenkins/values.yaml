controller:
  admin:
    username: admin
    password: jenkins123
  serviceType: ClusterIP
  installPlugins:
    - kubernetes:latest
    - workflow-aggregator:latest
    - git:latest
    - configuration-as-code:latest
    - credentials-binding:latest
  javaOpts: "-Djenkins.install.runSetupWizard=false"
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      memory: "2Gi"

serviceAccount:
  create: true
  name: jenkins

persistence:
  enabled: false
