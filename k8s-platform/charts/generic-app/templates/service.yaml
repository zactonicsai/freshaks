{{- $longRunning := has .Values.kind (list "Deployment" "StatefulSet" "DaemonSet") -}}
{{- if and $longRunning .Values.ports .Values.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "app.name" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "app.selectorLabels" . | nindent 4 }}
  ports:
    {{- range $name, $port := .Values.ports }}
    - name: {{ $name }}
      port: {{ $port | int }}
      targetPort: {{ $name }}
    {{- end }}
{{- end }}
{{- if eq .Values.kind "StatefulSet" }}
---
# Gives every StatefulSet pod a stable DNS name.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "app.name" . }}-headless
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "app.selectorLabels" . | nindent 4 }}
  {{- with .Values.ports }}
  ports:
    {{- range $name, $port := . }}
    - name: {{ $name }}
      port: {{ $port | int }}
      targetPort: {{ $name }}
    {{- end }}
  {{- end }}
{{- end }}
