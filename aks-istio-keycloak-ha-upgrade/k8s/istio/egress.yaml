# Controlled way out of the mesh. The mesh runs in REGISTRY_ONLY mode, so a pod
# can only reach an internet host that is declared here, and the traffic for
# that host is forced through the egress gateway pods.
#   app pod -> sidecar -> egress gateway -> internet
# The application opens the HTTPS connection itself; the gateway only looks at
# the host name in the TLS handshake (SNI) and passes the bytes through.

# 1. Tell the mesh that the external host exists.
apiVersion: networking.istio.io/v1
kind: ServiceEntry
metadata:
  name: allowed-external-host
  namespace: istio-egress
spec:
  hosts:
    - "__EGRESS_HOST__"
  # The host is outside the mesh.
  location: MESH_EXTERNAL
  ports:
    - number: 443
      name: tls
      protocol: TLS
  # Find its IP addresses with DNS.
  resolution: DNS
---
# 2. Open port 443 on the egress gateway for that host.
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: egress-gateway
  namespace: istio-egress
spec:
  # Apply to the pods of the "istio-egressgateway" Helm release.
  selector:
    istio: egressgateway
  servers:
    - port:
        number: 443
        name: tls
        protocol: TLS
      hosts:
        - "__EGRESS_HOST__"
      tls:
        # Do not decrypt: forward the application's own TLS connection.
        mode: PASSTHROUGH
---
# 3. Give the route below a named target on the egress gateway Service.
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: egress-gateway
  namespace: istio-egress
spec:
  host: istio-egressgateway.istio-egress.svc.cluster.local
  subsets:
    - name: external
---
# 4. Two hops: sidecar -> egress gateway, then egress gateway -> internet.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: allowed-external-host-via-egress
  namespace: istio-egress
spec:
  hosts:
    - "__EGRESS_HOST__"
  gateways:
    # "mesh" = all sidecars.
    - mesh
    # The Gateway defined above.
    - egress-gateway
  tls:
    # Hop 1: a sidecar sees a TLS connection for the host and sends it to the
    # egress gateway instead of straight to the internet.
    - match:
        - gateways:
            - mesh
          port: 443
          sniHosts:
            - "__EGRESS_HOST__"
      route:
        - destination:
            host: istio-egressgateway.istio-egress.svc.cluster.local
            subset: external
            port:
              number: 443
    # Hop 2: the egress gateway forwards the connection to the real host.
    - match:
        - gateways:
            - egress-gateway
          port: 443
          sniHosts:
            - "__EGRESS_HOST__"
      route:
        - destination:
            host: "__EGRESS_HOST__"
            port:
              number: 443
